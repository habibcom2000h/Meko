plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.meko.meko"
    compileSdk 36

    defaultConfig {
        applicationId "com.meko.meko"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.13.1"
            force "androidx.core:core-ktx:1.13.1"
            force "androidx.appcompat:appcompat:1.7.0"
        }
    }

    // إجبار كل مكتبات Android على استخدام SDK حديث
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }
}

flutter {
    source "../.."
}
