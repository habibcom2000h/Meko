plugins {
    id "com.android.application" version "8.6.1" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

subprojects { project ->
    project.afterEvaluate {
        if (project.hasProperty("android")) {
            project.android.compileSdkVersion 36
        }
    }
}
