workflows:
  meko-android:
    name: Meko Android

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Get packages
        script: |
          flutter pub get

      - name: Force Android DSL compatibility
        script: |
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
