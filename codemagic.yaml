workflows:
  meko-android:
    name: Meko Android

    environment:
      flutter: 3.41.0
      java: 17

    scripts:
      - name: Check Flutter and Android files
        script: |
          echo "===== FLUTTER ====="
          flutter --version

          echo "===== BUILD.GRADLE ====="
          cat android/build.gradle

          echo "===== SETTINGS.GRADLE ====="
          cat android/settings.gradle

          echo "===== GRADLE.PROPERTIES ====="
          cat android/gradle.properties

      - name: Get packages
        script: |
          flutter pub get

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
