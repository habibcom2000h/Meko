workflows:
  meko-android:
    name: Meko Android

    environment:
      flutter: 3.41.0
      java: 17

    scripts:
      - name: Check project
        script: |
          echo "=== Flutter ==="
          flutter --version

          echo "=== Java ==="
          java -version

          echo "=== Android files ==="
          find android -maxdepth 4 -type f | sort

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
