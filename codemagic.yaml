workflows:
  meko-android:
    name: Meko Android

    environment:
      flutter: 3.41.0
      java: 17

    scripts:
      - name: Get packages
        script: |
          flutter pub get

      - name: Disable Flutter Android auto-upgrade
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
