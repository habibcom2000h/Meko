workflows:
  meko-android:
    name: Meko Android

    environment:
      flutter: 3.41.0
      java: 17

    scripts:
      - name: Check Flutter and Gradle
        script: |
          echo "===== FLUTTER VERSION ====="
          flutter --version

          echo "===== JAVA VERSION ====="
          java -version

          echo "===== GRADLE FILES ====="
          find android -maxdepth 3 -type f | sort

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
