workflows:
  meko-android:
    name: Meko Android
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Check project
        script: |
          pwd
          ls -la
          test -f pubspec.yaml

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
