workflows:
  meko-android:
    name: Meko Android

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Show Flutter version
        script: |
          echo "===== FLUTTER VERSION ====="
          flutter --version
          echo "===== FLUTTER DOCTOR ====="
          flutter doctor -v

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
